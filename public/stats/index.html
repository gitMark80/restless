<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Question Stats | Restless.faith</title>
<style>
:root{--navy:#0f2a44;--blue:#2087e8;--blue-soft:#eaf4ff;--cream:#fbf7ee;--paper:#fff;--ink:#10263d;--muted:#60758a;--line:#dbe6ef;--gold:#e0b96a;
--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 var(--sans)}
header{background:var(--navy);color:#fff;padding:18px 16px 16px}
header .in,main{max-width:720px;margin:0 auto}
header a{color:#c9dcf0;text-decoration:none;font-size:13px}
h1{font:600 26px/1.15 var(--serif);margin:6px 0 2px}
header p{margin:0;color:#c9dcf0;font-size:13px}
main{padding:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font:600 28px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font:600 18px var(--serif);margin:0 0 10px}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px}
.chart div{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}
.chart div.today{background:var(--gold)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.mix{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.mix:first-of-type{border-top:0}
.mix span{color:var(--muted)}
.mix b{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:4px 2px 20px}
.msg{padding:24px 10px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="in">
<a href="/">&larr; Restless</a>
<h1>Question Stats</h1>
<p id="updated">Loading…</p>
</div></header>
<main>
<div class="tiles">
<div class="tile"><b id="t-today">–</b><span>questions today</span></div>
<div class="tile"><b id="t-7">–</b><span>last 7 days</span></div>
<div class="tile"><b id="t-30">–</b><span>last 30 days</span></div>
<div class="tile"><b id="t-all">–</b><span>all time</span></div>
</div>
<div class="card">
<h2>Questions per day (last 30 days)</h2>
<div id="daily-wrap"><div class="chart" id="daily"></div><div class="axis"><span id="ax0"></span><span>today</span></div></div>
</div>
<div class="card">
<h2>Last 30 days</h2>
<div id="mix"><div class="msg">Loading…</div></div>
</div>
<p class="note">Counts only how many questions Restless answered. The questions themselves are never stored. Days roll over at midnight Central time.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString();
const short = d => new Date(d + "T12:00:00Z").toLocaleDateString(undefined, {month: "short", day: "numeric"});
const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "–";
fetch("/api/stats", {cache: "no-store"}).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
  const sum = (arr, k) => arr.reduce((a, x) => a + (x[k] || 0), 0);
  const last = n => d.days.slice(-n);
  $("t-today").textContent = fmt(d.days[d.days.length - 1].total);
  $("t-7").textContent = fmt(sum(last(7), "total"));
  $("t-30").textContent = fmt(sum(d.days, "total"));
  $("t-all").textContent = fmt(d.allTime.total);
  const max = Math.max(1, ...d.days.map(x => x.total));
  $("daily").innerHTML = d.days.map((x, i) => `<div style="height:${Math.max(2, x.total / max * 100)}%" ${i === d.days.length - 1 ? 'class="today"' : ""} title="${short(x.date)}: ${x.total}"></div>`).join("");
  $("ax0").textContent = short(d.days[0].date);
  const t = sum(d.days, "total"), f = sum(d.days, "followup"), es = sum(d.days, "es");
  const busiest = d.days.reduce((a, x) => x.total > a.total ? x : a, d.days[0]);
  $("mix").innerHTML = [
    ["New conversations", fmt(t - f)],
    ["Follow-up questions", `${fmt(f)} (${pct(f, t)})`],
    ["Asked in Spanish", `${fmt(es)} (${pct(es, t)})`],
    ["Average per day", (t / 30).toFixed(1)],
    ["Busiest day", busiest.total ? `${short(busiest.date)} (${fmt(busiest.total)})` : "–"],
  ].map(([k, v]) => `<div class="mix"><span>${k}</span><b>${v}</b></div>`).join("");
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
}).catch(e => {
  $("updated").textContent = "Couldn't load stats";
  $("mix").innerHTML = `<div class="msg">${e === 503 ? "The question counter isn't connected yet. In Vercel, connect the Upstash Redis database to the restless project, then redeploy." : "Couldn't reach the stats right now. Try again in a minute."}</div>`;
});
</script>
</body>
</html>
