  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const normalize = (value) =>
          String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/[.,;()]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        const BOOKS = {
          genesis: "genesis", gen: "genesis", genesis_es: "genesis",
          exodus: "exodus", ex: "exodus", exodo: "exodus",
          leviticus: "leviticus", lev: "leviticus", levitico: "leviticus",
          numbers: "numbers", num: "numbers", numeros: "numbers",
          deuteronomy: "deuteronomy", deut: "deuteronomy", deuteronomio: "deuteronomy",
          joshua: "joshua", josue: "joshua",
          judges: "judges", jueces: "judges",
          ruth: "ruth", rut: "ruth",
          "1 samuel": "1samuel", "2 samuel": "2samuel", "1 sam": "1samuel", "2 sam": "2samuel",
          "1 kings": "1kings", "2 kings": "2kings", "1 kgs": "1kings", "2 kgs": "2kings", "1 reyes": "1kings", "2 reyes": "2kings",
          "1 chronicles": "1chronicles", "2 chronicles": "2chronicles", "1 chr": "1chronicles", "2 chr": "2chronicles", "1 cronicas": "1chronicles", "2 cronicas": "2chronicles",
          ezra: "ezra", esdras: "ezra", nehemiah: "nehemiah", nehemias: "nehemiah",
          tobit: "tobit", tobias: "tobit", judith: "judith", judit: "judith", esther: "esther", ester: "esther",
          "1 maccabees": "1maccabees", "2 maccabees": "2maccabees", "1 macc": "1maccabees", "2 macc": "2maccabees", "1 macabeos": "1maccabees", "2 macabeos": "2maccabees",
          job: "job", psalms: "psalms", psalm: "psalms", ps: "psalms", salmos: "psalms", salmo: "psalms",
          proverbs: "proverbs", prov: "proverbs", proverbios: "proverbs", ecclesiastes: "ecclesiastes", eccl: "ecclesiastes", eclesiastes: "ecclesiastes",
          "song of songs": "songofsongs", "song of solomon": "songofsongs", "cantar de los cantares": "songofsongs",
          wisdom: "wisdom", wis: "wisdom", sabiduria: "wisdom", sirach: "sirach", sir: "sirach", eclesiastico: "sirach", siracida: "sirach",
          isaiah: "isaiah", is: "isaiah", isaias: "isaiah", jeremiah: "jeremiah", jer: "jeremiah", jeremias: "jeremiah", lamentations: "lamentations", lamentaciones: "lamentations",
          baruch: "baruch", baruc: "baruch", ezekiel: "ezekiel", ez: "ezekiel", ezequiel: "ezekiel", daniel: "daniel", dn: "daniel",
          hosea: "hosea", hos: "hosea", oseas: "hosea", joel: "joel", amos: "amos", obadiah: "obadiah", ob: "obadiah", abdias: "obadiah",
          jonah: "jonah", jon: "jonah", jonas: "jonah", micah: "micah", mi: "micah", miqueas: "micah", nahum: "nahum", nah: "nahum", habakkuk: "habakkuk", hab: "habakkuk", habacuc: "habakkuk",
          zephaniah: "zephaniah", zep: "zephaniah", sofonias: "zephaniah", haggai: "haggai", hag: "haggai", ageo: "haggai", zechariah: "zechariah", zech: "zechariah", zacarias: "zechariah", malachi: "malachi", mal: "malachi", malaquias: "malachi",
          matthew: "matthew", mt: "matthew", mateo: "matthew",
          mark: "mark", mk: "mark", marcos: "mark", mc: "mark",
          luke: "luke", lk: "luke", lucas: "luke", lc: "luke",
          john: "john", jn: "john", juan: "john",
          acts: "acts", act: "acts", hechos: "acts", romans: "romans", romanos: "romans", rom: "romans",
          "1 corinthians": "1corinthians", "2 corinthians": "2corinthians", "1 corintios": "1corinthians", "2 corintios": "2corinthians", "1 cor": "1corinthians", "2 cor": "2corinthians",
          galatians: "galatians", gal: "galatians", galatas: "galatians", ephesians: "ephesians", eph: "ephesians", efesios: "ephesians",
          philippians: "philippians", phil: "philippians", filipenses: "philippians", colossians: "colossians", col: "colossians", colosenses: "colossians",
          "1 thessalonians": "1thessalonians", "2 thessalonians": "2thessalonians", "1 thess": "1thessalonians", "2 thess": "2thessalonians", "1 tesalonicenses": "1thessalonians", "2 tesalonicenses": "2thessalonians",
          "1 timothy": "1timothy", "2 timothy": "2timothy", "1 tim": "1timothy", "2 tim": "2timothy", "1 timoteo": "1timothy", "2 timoteo": "2timothy",
          titus: "titus", tit: "titus", tito: "titus", philemon: "philemon", phlm: "philemon", filemon: "philemon", hebrews: "hebrews", heb: "hebrews", hebreos: "hebrews",
          james: "james", jas: "james", santiago: "james", "1 peter": "1peter", "2 peter": "2peter", "1 pet": "1peter", "2 pet": "2peter", "1 pedro": "1peter", "2 pedro": "2peter",
          "1 john": "1john", "2 john": "2john", "3 john": "3john", "1 jn": "1john", "2 jn": "2john", "3 jn": "3john", "1 juan": "1john", "2 juan": "2john", "3 juan": "3john",
          jude: "jude", judas: "jude", revelation: "revelation", rev: "revelation", apocalypse: "revelation", apocalipsis: "revelation"
        };
        BOOKS.genesis_es = BOOKS.genesis;
        const BOOK_KEYS = Object.keys(BOOKS).filter((key) => key !== "genesis_es").sort((a, b) => b.length - a.length);

        function sourceLabel(anchor) {
          const own = anchor.textContent.trim();
          if (/catechism|catecismo|\bccc\b|\d{1,3}\s*:\s*\d{1,3}/i.test(own)) return own;
          let node = anchor.parentElement;
          while (node && node !== document.body) {
            const button = node.querySelector("button");
            if (button) {
              const span = button.querySelector("span");
              if (span?.textContent) return span.textContent.trim();
            }
            node = node.parentElement;
          }
          return own;
        }

        function exactBibleUrl(label) {
          const match = String(label || "").match(/^(.*?)(\d{1,3})\s*:\s*(\d{1,3})/);
          if (!match) return null;
          const bookText = normalize(match[1]);
          const key = BOOK_KEYS.find((candidate) => bookText === candidate || bookText.endsWith(` ${candidate}`));
          if (!key) return null;
          const chapter = Number(match[2]);
          const verse = Number(match[3]);
          return `https://bible.usccb.org/bible/${BOOKS[key]}/${chapter}?${verse}=`;
        }

        function exactCatechismUrl(label) {
          if (!/catechism|catecismo|\bccc\b/i.test(String(label || ""))) return null;
          const match = String(label || "").match(/(?:§{1,2}\s*)?(\d{1,4})/);
          if (!match) return null;
          const paragraph = Number(match[1]);
          if (paragraph < 1 || paragraph > 2865) return null;
          return `/api/source?ccc=${paragraph}`;
        }

        function rewriteSourceAnchor(anchor) {
          if (!anchor?.href) return null;
          let url;
          try {
            url = new URL(anchor.href, window.location.origin);
          } catch {
            return null;
          }

          const genericBible = url.hostname === "bible.usccb.org" && url.pathname.replace(/\/$/, "") === "/bible";
          const genericCatechism =
            url.hostname.endsWith("vatican.va") && /\/archive\/ENG0015\/_INDEX\.HTM$/i.test(url.pathname);
          if (!genericBible && !genericCatechism) return null;

          const label = sourceLabel(anchor);
          const exact = genericBible ? exactBibleUrl(label) : exactCatechismUrl(label);
          if (exact) {
            anchor.href = exact;
            anchor.dataset.restlessExactSource = "true";
          }
          return exact;
        }

        function rewriteSourceLinks(root = document) {
          if (root.matches?.("a[href]")) rewriteSourceAnchor(root);
          root.querySelectorAll?.("a[href]").forEach(rewriteSourceAnchor);
        }

        const sourceObserver = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (node.nodeType === Node.ELEMENT_NODE) rewriteSourceLinks(node);
            }
          }
        });
        sourceObserver.observe(document.body, { childList: true, subtree: true });
        rewriteSourceLinks(document);

        document.addEventListener(
          "click",
          (event) => {
            const anchor = event.target.closest?.("a");
            if (!anchor) return;
            const exact = rewriteSourceAnchor(anchor);
            if (!exact) return;

            event.preventDefault();
            if (anchor.target === "_blank") {
              const opened = window.open(exact, "_blank");
              if (opened) opened.opener = null;
            } else {
              window.location.assign(exact);
            }
          },
          true
        );
      })();
    </script>
  </body>
</html>
